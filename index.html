<!DOCTYPE html>
<html lang="de" data-theme="day">
<head>
  <!-- PWA & App-Icon Konfiguration -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="theme-color" content="#141413">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PERSPEKTIVE.">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERSPEKTIVE — Tagesblatt für Analyse, Geschichte & Weltspiegel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-paper: #FAF7F2;
      --bg-card: #F3EFE6;
      --bg-note: #EFE9DD;
      --ink-primary: #1A1917;
      --ink-secondary: #4A4741;
      --ink-muted: #78736A;
      --accent: #8B261D; /* Klassisches Zeitungs-Ochsenblut */
      --accent-soft: rgba(139, 38, 29, 0.12);
      --border-hairline: #DED8CC;
      --border-strong: #1A1917;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Newsreader', Georgia, serif;
      --font-ui: 'Inter', -apple-system, sans-serif;
    }

    [data-theme="evening"] {
      --bg-paper: #131518;
      --bg-card: #1B1E23;
      --bg-note: #22262C;
      --ink-primary: #EAE5DC;
      --ink-secondary: #B8B2A6;
      --ink-muted: #827D73;
      --accent: #D46A5E;
      --accent-soft: rgba(212, 106, 94, 0.16);
      --border-hairline: #2B2F36;
      --border-strong: #EAE5DC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-paper);
      color: var(--ink-primary);
      font-family: var(--font-body);
      line-height: 1.78;
      transition: background-color 0.35s ease, color 0.35s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Sticky Lese-Fortschritt & Kapitel-Kompass */
    .reading-ribbon {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg-paper);
      border-bottom: 1px solid var(--border-hairline);
      transform: translateY(-100%);
      transition: transform 0.3s ease;
      padding: 0.55rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-ui);
      font-size: 0.75rem;
    }
    .reading-ribbon.visible { transform: translateY(0); }
    .ribbon-progress {
      position: absolute;
      bottom: -1px; left: 0;
      height: 2px;
      background: var(--accent);
      width: 0%;
      transition: width 0.1s linear;
    }
    .ribbon-chapter {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Zeitungskopf (Masthead) */
    header.masthead {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 1.25rem;
      border-bottom: 3px double var(--border-strong);
    }
    .masthead-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-hairline);
      gap: 1rem;
      flex-wrap: wrap;
    }
    .theme-toggle, .archive-select {
      background: transparent;
      border: 1px solid var(--border-hairline);
      color: var(--ink-primary);
      padding: 0.3rem 0.75rem;
      border-radius: 2px;
      font-family: var(--font-ui);
      font-size: 0.72rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.2s;
    }
    .theme-toggle:hover, .archive-select:hover { border-color: var(--accent); color: var(--accent); }
    .archive-select { background: var(--bg-paper); }

    .masthead-title-wrap {
      text-align: center;
      padding: 1.6rem 0 1.2rem;
    }
    .masthead-kicker {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    h1.paper-name {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 6vw, 4.6rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1;
      text-transform: uppercase;
    }
    .paper-motto {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--ink-secondary);
      font-size: 1.02rem;
      margin-top: 0.5rem;
    }

    /* Artikel-Navigation (Die 5 Essays des Tages) */
    nav.edition-nav {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--border-hairline);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.85rem;
    }
    .nav-card {
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-left: 2px solid var(--border-hairline);
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--ink-primary);
    }
    .nav-card:hover { background: var(--bg-card); }
    .nav-card.active {
      border-left: 3px solid var(--accent);
      background: var(--bg-card);
    }
    .nav-card-rubrik {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
      display: block;
      margin-bottom: 0.2rem;
    }
    .nav-card-title {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.25;
      display: block;
    }

    /* Haupt-Layout mit Marginalien-Spalte */
    main.article-shell {
      max-width: 1140px;
      margin: 0 auto;
      padding: 2.8rem 1.5rem 5rem;
      display: grid;
      grid-template-columns: 1fr minmax(auto, 68ch) 240px;
      gap: 2.5rem;
      align-items: start;
    }
    .article-column { grid-column: 2; }
    .margin-column {
      grid-column: 3;
      position: sticky;
      top: 4.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    @media (max-width: 1024px) {
      main.article-shell {
        grid-template-columns: 1fr;
        max-width: 720px;
      }
      .article-column { grid-column: 1; }
      .margin-column {
        grid-column: 1;
        position: static;
        margin-top: 2rem;
      }
    }

    /* Artikelkopf */
    .article-header {
      margin-bottom: 2.2rem;
      padding-bottom: 1.6rem;
      border-bottom: 1px solid var(--border-hairline);
    }
    .article-rubrik-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.85rem;
    }
    .article-headline {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 4vw, 3.15rem);
      font-weight: 700;
      line-height: 1.13;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
    }
    .article-subhead {
      font-family: var(--font-body);
      font-size: 1.22rem;
      font-style: italic;
      color: var(--ink-secondary);
      line-height: 1.5;
    }

    /* Bild-Figur mit automatischem Wikimedia/CC-Nachweis */
    figure.hero-figure {
      margin: 0 0 2.2rem;
      background: var(--bg-card);
      padding: 0.85rem;
      border: 1px solid var(--border-hairline);
    }
    figure.hero-figure img {
      width: 100%;
      max-height: 410px;
      object-fit: cover;
      display: block;
      filter: contrast(1.03) sepia(0.06);
    }
    figure.hero-figure figcaption {
      margin-top: 0.65rem;
      font-family: var(--font-ui);
      font-size: 0.74rem;
      color: var(--ink-muted);
      line-height: 1.45;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Essay-Typografie */
    .essay-body {
      font-size: 1.15rem;
      color: var(--ink-primary);
    }
    .essay-body p {
      margin-bottom: 1.45rem;
      text-align: left;
      hyphens: auto;
    }
    .essay-body > p:first-of-type::first-letter {
      font-family: var(--font-display);
      font-size: 4.1rem;
      font-weight: 700;
      float: left;
      line-height: 0.82;
      padding-right: 0.65rem;
      padding-top: 0.15rem;
      color: var(--accent);
    }
    .essay-body h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      margin: 2.6rem 0 1rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border-hairline);
      line-height: 1.22;
    }
    .essay-body blockquote {
      margin: 2rem 0;
      padding: 1.1rem 1.5rem;
      border-left: 3px solid var(--accent);
      background: var(--bg-card);
      font-style: italic;
      font-size: 1.18rem;
      color: var(--ink-secondary);
    }

    /* Historischer Resonanz-Anker (Klickbare Zeitkapsel) */
    .history-anchor {
      border-bottom: 1.5px dotted var(--accent);
      background: var(--accent-soft);
      padding: 0 0.25rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .history-anchor:hover { background: rgba(139, 38, 29, 0.22); }

    /* Marginalien-Karten (Flair-Element rechts) */
    .margin-card {
      border-top: 2px solid var(--border-strong);
      padding-top: 0.8rem;
      font-size: 0.88rem;
    }
    .margin-label {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.4rem;
      display: block;
    }
    .margin-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.45rem;
    }
    .margin-text {
      font-family: var(--font-body);
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--ink-secondary);
    }

    /* Weltspiegel (Presseschau) */
    section.weltspiegel {
      margin-top: 3.5rem;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-top: 3px solid var(--border-strong);
    }
    .weltspiegel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.4rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-hairline);
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .weltspiegel-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 700;
    }
    .weltspiegel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.25rem;
    }
    .press-item {
      padding: 1rem;
      background: var(--bg-paper);
      border: 1px solid var(--border-hairline);
    }
    .press-meta {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .press-summary {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--ink-secondary);
      margin-bottom: 0.6rem;
    }
