name: Tägliche Zeitungsausgabe generieren

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-edition:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini SDK installieren
        run: pip install --no-cache-dir google-genai

      - name: Tagesausgabe generieren
     env:
       GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
       GOOGLE_GENAI_USE_VERTEXAI: "true"
       GOOGLE_CLOUD_PROJECT: "53810350049"
       GOOGLE_CLOUD_LOCATION: "us-central1"
     run: python scripts/generate_edition.py

      - name: Neue Ausgabe speichern & veröffentlichen
        run: |
          git config user.name "Perspektive Redaktions-Bot"
          git config user.email "bot@perspektive-lesen.de"
          git add data/ausgabe.json
          git commit -m "Tagesausgabe aktualisiert" || exit 0
          git push
